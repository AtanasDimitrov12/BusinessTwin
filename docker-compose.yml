# Local development: API + PostgreSQL with one command.
#   cp .env.example .env    # then set a password
#   docker compose up --build
# The web app runs separately with `npm run dev` in web/ and proxies /api to the API on port 5175.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: businesstwin
      POSTGRES_USER: businesstwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businesstwin -d businesstwin"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=businesstwin;Username=businesstwin;Password=${POSTGRES_PASSWORD}
    ports:
      - "5175:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
